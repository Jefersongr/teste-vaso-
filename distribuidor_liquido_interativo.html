<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distribuidor de Líquido — DDL-01</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #0b5cad;
    --accent2: #0f766e;
    --danger: #c62828;
    --service: #1d4ed8;
    --instrument: #15803d;
    --border: #dbe3ef;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef3f8;
    color: var(--text);
  }

  .app {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  header {
    background: linear-gradient(90deg, #0b3f6c, #0b5cad);
    color: white;
    padding: 16px 22px;
    display: flex;
    justify-content: space-between;
    gap: 18px;
    align-items: center;
    flex-wrap: wrap;
  }

  header h1 {
    margin: 0;
    font-size: clamp(22px, 3vw, 34px);
    letter-spacing: .2px;
  }

  header p {
    margin: 4px 0 0;
    opacity: .9;
    font-size: 14px;
  }

  .tag {
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.3);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
  }

  main {
    padding: 18px;
  }

  .stage {
    width: min(1120px, 100%);
    margin: 0 auto;
  }

  .instruction {
    margin-bottom: 12px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: #334155;
    font-size: 14px;
  }

  .image-wrap {
    position: relative;
    width: 100%;
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(15,23,42,.08);
  }

  .image-wrap img {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }

  .hotspot {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid white;
    color: white;
    font-weight: 700;
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: 0 4px 12px rgba(15,23,42,.32);
    transition: transform .18s ease, box-shadow .18s ease;
    z-index: 3;
  }

  .hotspot:hover, .hotspot:focus {
    transform: translate(-50%, -50%) scale(1.12);
    box-shadow: 0 6px 18px rgba(15,23,42,.4);
    outline: none;
  }

  .service { background: var(--service); }
  .instrument { background: var(--instrument); }
  .safety { background: var(--danger); }
  .equipment { background: #a16207; }

  .pulse::after {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px solid currentColor;
    opacity: .35;
    animation: pulse 1.8s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(.85); opacity: .45; }
    70% { transform: scale(1.35); opacity: 0; }
    100% { opacity: 0; }
  }

  .legend {
    margin-top: 12px;
    display: flex;
    gap: 10px 16px;
    flex-wrap: wrap;
    font-size: 13px;
    color: #475569;
  }

  .legend span {
    display: inline-flex;
    gap: 7px;
    align-items: center;
  }

  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    display: inline-block;
  }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.58);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    z-index: 20;
  }

  .modal.show { display: flex; }

  .modal-card {
    width: min(560px, 100%);
    max-height: min(82vh, 760px);
    overflow: auto;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 24px 80px rgba(0,0,0,.28);
    border: 1px solid #d7dee8;
  }

  .modal-head {
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .modal-head h2 {
    margin: 0;
    font-size: 21px;
  }

  .close {
    border: 0;
    background: #eef2f7;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 22px;
    line-height: 1;
  }

  .modal-body {
    padding: 16px 18px 20px;
  }

  .info-grid {
    display: grid;
    grid-template-columns: minmax(150px, 42%) 1fr;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .info-grid div {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }

  .info-grid div:nth-last-child(-n+2) {
    border-bottom: 0;
  }

  .label {
    background: #f8fafc;
    font-weight: 700;
    color: #334155;
  }

  .value {
    background: white;
  }

  .note {
    margin-top: 14px;
    background: #f8fafc;
    border-left: 4px solid var(--accent);
    padding: 11px 12px;
    border-radius: 8px;
    font-size: 13px;
    color: #475569;
  }

  @media (max-width: 640px) {
    .hotspot {
      width: 28px;
      height: 28px;
      font-size: 12px;
      border-width: 2px;
    }
    .info-grid {
      grid-template-columns: 1fr;
    }
    .info-grid div {
      border-bottom: 1px solid var(--border) !important;
    }
    .info-grid div:last-child {
      border-bottom: 0 !important;
    }
  }
</style>
</head>

    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const dados = {
  equipamento: {
    titulo: "Dados do Distribuidor de Líquido",
    linhas: [
      ["Equipamento", "Distribuidor de Líquido"],
      ["TAG", "DDL-01"],
      ["Modelo", "RDL-5"],
      ["Nº de série", "230.161"],
      ["Fabricante", "MADEF"],

      ["Finalidade", "Armazenamento de fluido refrigerante"],
      ["Fluido de operação", "Amônia"],
      ["Volume interno", "0,54 m³ / 540 litros"],
      ["Diâmetro externo", "644,0 mm"],
      ["Diâmetro interno", "625,0 mm"],
      ["Comprimento do corpo", "1.500 mm"],
      ["Espessura nominal do corpo", "9,5 mm"],
      ["Espessura nominal dos tampos", "9,5 mm"],
      ["Espessura mínima calculada", "5,13 mm"],
      ["PMTA", "16,00 kgf/cm²"],
      ["Pressão de teste hidrostático", "24,00 kgf/cm²"],
      ["Categoria NR-13", "III"],
      ["Código de projeto", "ASME Seção VIII – 2021"]
    ],
    nota: "Dados extraídos do relatório de inspeção periódica do equipamento DDL-01."
  },
  manometro: {
    titulo: "Manômetro",
    linhas: [
      ["Componente", "Indicador de pressão"],
      ["Função", "Monitoramento da pressão do vaso durante a operação"],
      ["Condição registrada", "Funcionando normalmente"],
      ["Observação do relatório", "Manter o manômetro sempre visível"]
    ],
    nota: "O relatório de inspeção registra o indicador de pressão como operacional."
  },
  psv: {
    titulo: "Válvula de Segurança — PSV",
    linhas: [
      ["Componente", "Válvula de segurança / alívio"],
      ["Função", "Proteção do vaso contra sobrepressão"],
      ["Condição registrada", "Dispositivos de segurança calibrados"],
      ["Inspeção", "Válvulas de segurança examinadas e calibradas"]
    ],
    nota: "A válvula de segurança é um dispositivo essencial de proteção contra sobrepressão."
  },
  servico1: {
    titulo: "Válvula de Serviço 1",
    linhas: [
      ["Localização visual", "Conexão lateral superior esquerda"],
      ["Tipo", "Válvula de serviço"],
      ["Função", "Isolamento e manobra da linha conectada ao vaso"]
    ]
  },
  servico2: {
    titulo: "Válvula de Serviço 2",
    linhas: [
      ["Localização visual", "Conexão superior central"],
      ["Tipo", "Válvula de serviço"],
      ["Função", "Isolamento e manobra da linha conectada ao vaso"]

  },
  servico3: {
    titulo: "Válvula de Serviço 3",
    linhas: [
      ["Localização visual", "Conexão inferior esquerda"],
      ["Tipo", "Válvula de serviço"],
      ["Função", "Isolamento e manobra da linha inferior"]
    ]
  },
  servico4: {
    titulo: "Válvula de Serviço 4",
    linhas: [
      ["Localização visual", "Conexão inferior direita"],
      ["Tipo", "Válvula de serviço"],

    ],
    nota: "A função exata desta conexão deve ser confirmada no fluxograma/P&ID do sistema."
  }
};

const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");
const closeBtn = document.getElementById("closeBtn");

function abrir(key) {
  const item = dados[key];
  if (!item) return;

  modalTitle.textContent = item.titulo;
  let linhas = item.linhas.map(([label, value]) =>
    `<div class="label">${label}</div><div class="value">${value}</div>`
  ).join("");

  modalBody.innerHTML = `
    <div class="info-grid">${linhas}</div>
    ${item.nota ? `<div class="note">${item.nota}</div>` : ""}
  `;
  modal.classList.add("show");
  closeBtn.focus();
}

function fechar() {
  modal.classList.remove("show");
}

document.querySelectorAll(".hotspot").forEach(btn => {
  btn.addEventListener("click", () => abrir(btn.dataset.key));
});

closeBtn.addEventListener("click", fechar);

modal.addEventListener("click", (e) => {
  if (e.target === modal) fechar();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") fechar();
});
</script>
</body>
</html>
